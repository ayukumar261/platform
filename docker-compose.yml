services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  kamailio:
    image: ghcr.io/kamailio/kamailio:6.1.5-bookworm
    environment:
      PUBLIC_IP_ADDRESS: ${PUBLIC_IP_ADDRESS:?}
    ports:
      - "${PUBLIC_IP_ADDRESS:?}:5060:5060/udp"
      - "${PUBLIC_IP_ADDRESS:?}:5060:5060/tcp"
    volumes:
      - ./docker/kamailio/kamailio.cfg:/etc/kamailio/kamailio.cfg:ro
    depends_on:
      livekit-sip:
        condition: service_started
      rtpengine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kamcmd", "core.uptime"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  livekit:
    image: livekit/livekit-server:latest
    command: --dev --config /etc/livekit.yaml
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:7882:7882/udp"
    volumes:
      - ./docker/livekit/livekit.yaml:/etc/livekit.yaml:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7880/"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  livekit-sip:
    image: livekit/sip:latest
    command: --config /etc/livekit-sip.yaml
    ports:
      - "127.0.0.1:5062:5062/udp"
      - "127.0.0.1:5062:5062/tcp"
      - "127.0.0.1:10000-10099:10000-10099/udp"
    volumes:
      - ./docker/livekit-sip/livekit-sip.yaml:/etc/livekit-sip.yaml:ro
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_healthy

  rtpengine:
    image: ghcr.io/ayukumar261/platform-rtpengine:latest
    build: ./docker/rtpengine
    command:
      - --interface=internal/eth0
      - --interface=external/eth0!${PUBLIC_IP_ADDRESS:?}
    ports:
      - "127.0.0.1:2223:2223/udp"
      - "${PUBLIC_IP_ADDRESS:?}:30000-30099:30000-30099/udp"
    volumes:
      - ./docker/rtpengine/rtpengine.conf:/etc/rtpengine/rtpengine.conf:ro
    healthcheck:
      test: ["CMD", "rtpengine-ctl", "list", "numsessions"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    image: ghcr.io/ayukumar261/platform-api:latest
    profiles: ["apps"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  bridge:
    image: ghcr.io/ayukumar261/platform-bridge:latest
    profiles: ["apps"]
    restart: on-failure
    env_file:
      - .env
    environment:
      LIVEKIT_URL: ws://livekit:7880
      KAMAILIO_HOST: kamailio
      KAMAILIO_PORT: "5070"
    depends_on:
      livekit:
        condition: service_healthy
      livekit-sip:
        condition: service_started
      kamailio:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
