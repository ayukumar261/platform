name: CI

on:
  push:
    branches: [main]
    paths:
      - "apps/bridge/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "apps/bridge/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  Bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/bridge
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/bridge/go.mod
          cache-dependency-path: apps/bridge/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...
