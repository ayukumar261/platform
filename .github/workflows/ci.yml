name: CI

on:
  workflow_call:
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/bridge/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  API:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm --filter api lint

  Bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/bridge
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/bridge/go.mod
          cache-dependency-path: apps/bridge/go.sum

      - name: Update package lists
        run: sudo apt-get update

      - name: Install pkg-config
        run: sudo apt-get install -y pkg-config

      - name: Install Opus
        run: sudo apt-get install -y libopus-dev libopusfile-dev

      - name: Install SoX Resampler
        run: sudo apt-get install -y libsoxr-dev

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...
