name: CI

on:
  workflow_call:
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/bridge/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  API:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm --filter api lint

  Bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/bridge
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/bridge/go.mod
          cache-dependency-path: apps/bridge/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...
