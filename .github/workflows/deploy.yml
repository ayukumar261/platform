name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  CI:
    uses: ./.github/workflows/ci.yml

  Deploy:
    needs: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Express API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/ayukumar261/platform-api:latest
            ghcr.io/ayukumar261/platform-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Push Go bridge image
        uses: docker/build-push-action@v6
        with:
          context: apps/bridge
          push: true
          tags: |
            ghcr.io/ayukumar261/platform-bridge:latest
            ghcr.io/ayukumar261/platform-bridge:${{ github.sha }}
          cache-from: type=gha,scope=bridge
          cache-to: type=gha,mode=max,scope=bridge

      - name: Push RTPEngine image
        uses: docker/build-push-action@v6
        with:
          context: docker/rtpengine
          push: true
          tags: |
            ghcr.io/ayukumar261/platform-rtpengine:latest
            ghcr.io/ayukumar261/platform-rtpengine:${{ github.sha }}
          cache-from: type=gha,scope=rtpengine
          cache-to: type=gha,mode=max,scope=rtpengine

      - name: Deploy on DigitalOcean Droplet
        env:
          PLATFORM_HOOK_SECRET: ${{ secrets.PLATFORM_HOOK_SECRET }}
          PLATFORM_HOOK_URL: ${{ secrets.PLATFORM_HOOK_URL }}
        run: |
          # The JSON payload the host receives
          BODY=$(printf '{"ref":"%s","sha":"%s"}' "$GITHUB_REF" "$GITHUB_SHA")

          # Sign the payload with the shared secret
          SIGNATURE=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$PLATFORM_HOOK_SECRET" -r | cut -d' ' -f1)

          # Send the signed payload to the deploy hook
          curl --fail --silent --show-error \
            --request POST "$PLATFORM_HOOK_URL" \
            --header "Content-Type: application/json" \
            --header "X-Hub-Signature-256: sha256=$SIGNATURE" \
            --data "$BODY"
