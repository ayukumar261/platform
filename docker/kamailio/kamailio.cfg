#!KAMAILIO

# Public address of the host
#!defenv PUBLIC_IP_ADDRESS

# RTPEngine options, where a new call also names its source and destination network
#!define MEDIA_FLAGS "replace-origin replace-session-connection"
#!define INBOUND_MEDIA_FLAGS "replace-origin replace-session-connection direction=external direction=internal"

debug=2
log_stderror=yes
children=2
auto_aliases=no

# External sockets for carriers
listen=udp:eth0:5060 advertise PUBLIC_IP_ADDRESS:5060 name "external"
listen=tcp:eth0:5060 advertise PUBLIC_IP_ADDRESS:5060

# Internal socket for LiveKit SIP
listen=udp:eth0:5070 name "internal"

loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "sanity.so"
loadmodule "ipops.so"
loadmodule "nathelper.so"
loadmodule "rtpengine.so"
loadmodule "ctl.so"

# Enable the Docker Compose health check
modparam("ctl", "binrpc", "unix:/run/kamailio/kamailio_ctl")
modparam("rr", "enable_double_rr", 2)
modparam("rtpengine", "rtpengine_sock", "udp:rtpengine:2223")

request_route {
    route(VALIDATE_REQUEST);
    route(CHECK_SOURCE);
    route(HANDLE_CANCELLATION);

    # Reuse transactions for repeated requests
    if (!is_method("ACK")) {
        t_check_trans();
    }

    if (has_totag()) {
        route(HANDLE_EXISTING_CALL);
    }

    route(HANDLE_NEW_REQUEST);
}

route[VALIDATE_REQUEST] {
    force_rport();

    # Stop requests that cross too many proxies
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    # Reject malformed SIP messages
    if (!sanity_check("1511", "7")) {
        exit;
    }
}

route[CHECK_SOURCE] {
    # Identify LiveKit SIP by its Docker hostname
    $var(is_livekit_request) = 0;
    if (dns_int_match_ip("livekit-sip", "$si")) {
        $var(is_livekit_request) = 1;
        return;
    }

    # Restrict other sources to loopback until SIP trunk setup
    if (!is_in_subnet("$si", "127.0.0.1/32")) {
        if (!is_method("ACK")) {
            sl_send_reply("403", "Forbidden");
        }
        exit;
    }
}

route[HANDLE_CANCELLATION] {
    if (!is_method("CANCEL")) {
        return;
    }

    # Match cancellations to the original request
    if (!t_check_trans()) {
        sl_send_reply("481", "Call/Transaction Does Not Exist");
        exit;
    }

    route(RELAY);
}

route[HANDLE_EXISTING_CALL] {
    # Route messages for existing requests
    if (loose_route()) {
        if ($du == $null && !handle_ruri_alias()) {
            if (!is_method("ACK")) {
                sl_send_reply("400", "Invalid Contact Alias");
            }
            exit;
        }

        # Release the audio ports when the call ends
        if (is_method("BYE")) {
            rtpengine_delete();
        }

        # Keep the audio on RTPEngine when the call changes
        if (has_body("application/sdp")) {
            rtpengine_manage(MEDIA_FLAGS);
            if (is_method("INVITE|UPDATE")) {
                t_on_reply("HANDLE_CHANGE_REPLY");
            }
        }

        route(RELAY);
    }

    # Forward acknowledgements for failed request attempts
    if (is_method("ACK")) {
        if (t_check_trans()) {
            route(RELAY);
        }
        exit;
    }

    sl_send_reply("481", "Call/Transaction Does Not Exist");
    exit;
}

route[HANDLE_NEW_REQUEST] {
    # Answer availability probes
    if (is_method("OPTIONS")) {
        sl_send_reply("200", "OK");
        exit;
    }

    # Ignore acknowledgements without a request
    if (is_method("ACK")) {
        exit;
    }

    # Accept only new requests
    if (!is_method("INVITE")) {
        append_to_reply("Allow: INVITE, ACK, CANCEL, BYE, OPTIONS\r\n");
        sl_send_reply("405", "Method Not Allowed");
        exit;
    }

    # Reject outbound requests and predefined routes
    if ($var(is_livekit_request) || is_present_hf("Route")) {
        sl_send_reply("403", "Inbound Calls Only");
        exit;
    }

    # Require a destination number
    if ($rU == $null || $rU == "") {
        sl_send_reply("484", "Address Incomplete");
        exit;
    }

    # Save the caller address for later requests
    if (nat_uac_test("19") && !set_contact_alias()) {
        sl_send_reply("400", "Invalid Contact");
        exit;
    }

    # Keep later requests routed through Kamailio
    record_route();

    # Release the audio ports if the call is not answered
    t_on_reply("HANDLE_CALL_REPLY");

    # Relay the audio from the carrier to LiveKit SIP
    if (has_body("application/sdp")) {
        rtpengine_manage(INBOUND_MEDIA_FLAGS);
    }

    # Send the request to LiveKit SIP
    $du = "sip:livekit-sip:5062;transport=udp";
    route(RELAY);
}

route[RELAY] {
    # Send through the socket that faces the other side
    if ($var(is_livekit_request)) {
        $fsn = "external";
    } else {
        $fsn = "internal";
    }

    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

onreply_route[HANDLE_CALL_REPLY] {
    # Connect the audio when answered and release it when refused
    if (has_body("application/sdp") || t_check_status("[3-6][0-9][0-9]")) {
        rtpengine_manage(MEDIA_FLAGS);
    }
}

onreply_route[HANDLE_CHANGE_REPLY] {
    # Apply an accepted change and ignore a refused one
    if (has_body("application/sdp") && t_check_status("[12][0-9][0-9]")) {
        rtpengine_manage(MEDIA_FLAGS);
    }
}
