#!KAMAILIO

# Public address of the host
#!defenv PUBLIC_IP_ADDRESS

# Carrier addresses for outbound calls
#!defenvs TELNYX_TERMINATION_URI
#!defenvs TWILIO_TERMINATION_URI

# Telnyx signaling addresses, from https://sip.telnyx.com/voice.json
#!define TELNYX_ADDRESSES "192.76.120.10/32,64.16.250.10/32,192.76.120.31/32,64.16.250.13/32,185.246.41.140/32,185.246.41.141/32,103.115.244.145/32,103.115.244.146/32,103.115.244.158/32,103.115.244.159/32,185.246.42.128/32,185.246.42.129/32"

# Twilio signaling addresses, from https://www.twilio.com/docs/sip-trunking/ip-addresses
#!define TWILIO_ADDRESSES "54.172.60.0/30,54.244.51.0/30,54.171.127.192/30,35.156.191.128/30,54.65.63.192/30,54.169.127.128/30,54.252.254.64/30,177.71.206.192/30"

# RTPEngine options, where a new call also names its source and destination network
#!define MEDIA_FLAGS "replace-origin replace-session-connection"
#!define INBOUND_MEDIA_FLAGS "replace-origin replace-session-connection direction=external direction=internal"
#!define OUTBOUND_MEDIA_FLAGS "replace-origin replace-session-connection direction=internal direction=external"

debug=2
log_stderror=yes
children=2
auto_aliases=no
server_signature=no

# External sockets for carriers
listen=udp:eth0:5060 advertise PUBLIC_IP_ADDRESS:5060 name "external"
listen=tcp:eth0:5060 advertise PUBLIC_IP_ADDRESS:5060

# Internal socket for LiveKit SIP
listen=udp:eth0:5070 name "internal"

loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "sanity.so"
loadmodule "ipops.so"
loadmodule "nathelper.so"
loadmodule "rtpengine.so"
loadmodule "tcpops.so"
loadmodule "ctl.so"

# Enable the Docker Compose health check
modparam("ctl", "binrpc", "unix:/run/kamailio/kamailio_ctl")
modparam("rr", "enable_double_rr", 2)
modparam("rtpengine", "rtpengine_sock", "udp:rtpengine:2223")

request_route {
    route(CHECK_SOURCE);
    route(VALIDATE_REQUEST);
    route(HANDLE_CANCELLATION);

    # Reuse transactions for repeated requests
    if (!is_method("ACK")) {
        t_check_trans();
    }

    if (has_totag()) {
        route(HANDLE_EXISTING_CALL);
    }

    route(HANDLE_NEW_REQUEST);
}

onreply_route {
    # Drop replies from unknown sources
    if (!dns_int_match_ip("livekit-sip", "$si") && !is_in_subnet("$si", TELNYX_ADDRESSES) && !is_in_subnet("$si", TWILIO_ADDRESSES)) {
        route(CLOSE_CONNECTION);
        drop;
    }
}

route[CHECK_SOURCE] {
    # Identify LiveKit SIP by its Docker hostname
    $var(is_livekit_request) = 0;
    if (dns_int_match_ip("livekit-sip", "$si")) {
        $var(is_livekit_request) = 1;
        return;
    }

    # Drop unknown sources without answering
    if (!is_in_subnet("$si", TELNYX_ADDRESSES) && !is_in_subnet("$si", TWILIO_ADDRESSES)) {
        route(CLOSE_CONNECTION);
        exit;
    }
}

route[CLOSE_CONNECTION] {
    # Hang up on TCP sources instead of leaving them connected
    if ($proto eq "tcp") {
        tcp_close_connection();
    }
}

route[VALIDATE_REQUEST] {
    force_rport();

    # Stop requests that cross too many proxies
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    # Reject malformed SIP messages
    if (!sanity_check("1511", "7")) {
        exit;
    }
}

route[HANDLE_CANCELLATION] {
    if (!is_method("CANCEL")) {
        return;
    }

    # Match cancellations to the original request
    if (!t_check_trans()) {
        sl_send_reply("481", "Call/Transaction Does Not Exist");
        exit;
    }

    route(RELAY);
}

route[HANDLE_EXISTING_CALL] {
    # Route messages for existing requests
    if (loose_route()) {
        if ($du == $null && !handle_ruri_alias()) {
            if (!is_method("ACK")) {
                sl_send_reply("400", "Invalid Contact Alias");
            }
            exit;
        }

        # Release the audio ports when the call ends
        if (is_method("BYE")) {
            rtpengine_delete();
        }

        # Keep the audio on RTPEngine when the call changes
        if (has_body("application/sdp")) {
            rtpengine_manage(MEDIA_FLAGS);
            if (is_method("INVITE|UPDATE")) {
                t_on_reply("HANDLE_CHANGE_REPLY");
            }
        }

        route(RELAY);
    }

    # Forward acknowledgements for failed request attempts
    if (is_method("ACK")) {
        if (t_check_trans()) {
            route(RELAY);
        }
        exit;
    }

    sl_send_reply("481", "Call/Transaction Does Not Exist");
    exit;
}

route[HANDLE_NEW_REQUEST] {
    # Answer availability probes
    if (is_method("OPTIONS")) {
        sl_send_reply("200", "OK");
        exit;
    }

    # Ignore acknowledgements without a request
    if (is_method("ACK")) {
        exit;
    }

    # Accept only new requests
    if (!is_method("INVITE")) {
        append_to_reply("Allow: INVITE, ACK, CANCEL, BYE, OPTIONS\r\n");
        sl_send_reply("405", "Method Not Allowed");
        exit;
    }

    # Reject predefined routes
    if (is_present_hf("Route")) {
        sl_send_reply("403", "Predefined Routes Not Allowed");
        exit;
    }

    # Require a destination number
    if ($rU == $null || $rU == "") {
        sl_send_reply("484", "Address Incomplete");
        exit;
    }

    # Keep later requests routed through Kamailio
    record_route();

    # Release the audio ports if the call is not answered
    t_on_reply("HANDLE_CALL_REPLY");

    if ($var(is_livekit_request)) {
        route(HANDLE_OUTBOUND_CALL);
    }

    route(HANDLE_INBOUND_CALL);
}

route[HANDLE_INBOUND_CALL] {
    # Save the UDP caller address for later requests
    if ($proto eq "udp" && nat_uac_test("19") && !set_contact_alias()) {
        sl_send_reply("400", "Invalid Contact");
        exit;
    }

    # Relay the audio from the carrier to LiveKit SIP
    if (has_body("application/sdp")) {
        rtpengine_manage(INBOUND_MEDIA_FLAGS);
    }

    # Send the request to LiveKit SIP
    $du = "sip:livekit-sip:5062;transport=udp";
    route(RELAY);
}

route[HANDLE_OUTBOUND_CALL] {
    # Read the carrier and hide the header from it
    $var(carrier) = $hdr(X-Carrier);
    remove_hf("X-Carrier");

    # Address the request to the carrier
    if ($var(carrier) eq "telnyx") {
        $ru = "sip:" + $rU + "@" + TELNYX_TERMINATION_URI;
    } else if ($var(carrier) eq "twilio") {
        $ru = "sip:" + $rU + "@" + TWILIO_TERMINATION_URI;
    } else {
        sl_send_reply("403", "Unknown Carrier");
        exit;
    }

    # Relay the audio from LiveKit SIP to the carrier
    if (has_body("application/sdp")) {
        rtpengine_manage(OUTBOUND_MEDIA_FLAGS);
    }

    route(RELAY);
}

route[RELAY] {
    # Send through the socket that faces the other side
    if ($var(is_livekit_request)) {
        $fsn = "external";
    } else {
        $fsn = "internal";
    }

    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

onreply_route[HANDLE_CALL_REPLY] {
    # Connect the audio when answered and release it when refused
    if (has_body("application/sdp") || t_check_status("[3-6][0-9][0-9]")) {
        rtpengine_manage(MEDIA_FLAGS);
    }
}

onreply_route[HANDLE_CHANGE_REPLY] {
    # Apply an accepted change and ignore a refused one
    if (has_body("application/sdp") && t_check_status("[12][0-9][0-9]")) {
        rtpengine_manage(MEDIA_FLAGS);
    }
}
